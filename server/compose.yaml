services:
  running-sop:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - running-sop-data:/data
    environment:
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-}
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
volumes:
  running-sop-data:
