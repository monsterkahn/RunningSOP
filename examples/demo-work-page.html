<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Running SOP · 演示工作页</title><style>body{font:18px system-ui;background:#f4f6fb;margin:8vh auto;max-width:760px;padding:24px;color:#203047}main{background:white;border-radius:20px;padding:40px}label,input,button{display:block;margin:16px 0}input,button{font:inherit;padding:12px;border:1px solid #ccd5e3;border-radius:10px}button{background:#315bf4;color:white;cursor:pointer}small{color:#64748b}</style><main><small>纯演示 · 不提交数据</small><h1>记录一次工作</h1><p>先填写工作名称，然后完成演示。没有任何服务器写入。</p><label for="name">本次工作名称</label><input id="name" placeholder="例如：我的演示任务"><button id="done">完成演示</button><p id="result" role="status"></p></main><script>document.querySelector('#done').onclick=()=>{const value=document.querySelector('#name').value.trim();document.querySelector('#result').textContent=value?'已完成：'+value:'请先填写工作名称。';};</script></html>
