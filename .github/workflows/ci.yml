name: Verify and package Running SOP
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:qr-browser
      - run: npm run test:folder-browser
      - run: npm run test:dashboard-languages
      - uses: actions/upload-artifact@v7
        with:
          name: running-sop-packages
          path: |
            dist/running-sop-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  windows:
    uses: ./.github/workflows/windows-compatibility.yml
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: running-sop-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: running-sop-packages
          path: dist
      - name: Synchronize historical release description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          historical_notes=docs/releases/v1.0.0.md
          historical_state=$(gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json body,isDraft)
          if [[ $(jq -r '.isDraft' <<< "$historical_state") == false ]] && \
             [[ $(jq -r '.body' <<< "$historical_state") != "$(cat "$historical_notes")" ]]; then
            gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --notes-file "$historical_notes"
          fi
      - name: Publish the version once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version=$(node -p "require('./package.json').version")
          release_tag="v${release_version}"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if release_state=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish); then
            if [[ $(jq -r '.isDraft' <<< "$release_state") == false ]]; then
              published_notes=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
              if [[ "$published_notes" != "$(cat docs/GITHUB-RELEASE.md)" ]]; then
                gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --notes-file docs/GITHUB-RELEASE.md
              fi
              echo "Release description synchronized; existing version and binary assets unchanged."
              exit 0
            fi
            if [[ $(jq -r '.targetCommitish' <<< "$release_state") != "$GITHUB_SHA" ]]; then
              echo "Existing draft targets a different commit; refusing to replace it."
              exit 1
            fi
          else
            gh release create "$release_tag" --draft \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Running SOP ${release_tag}" --notes-file docs/GITHUB-RELEASE.md
          fi
          gh release upload "$release_tag" dist/running-sop-*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          verification_dir=$(mktemp -d)
          trap 'rm -rf "$verification_dir"' EXIT
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$verification_dir" --pattern 'running-sop-*.zip' --pattern SHA256SUMS.txt
          cmp dist/SHA256SUMS.txt "$verification_dir/SHA256SUMS.txt"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS.txt)
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false
