<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Running SOP</title><link rel="icon" href="assets/icons/icon-32.png"><link rel="stylesheet" href="library.css"></head>
<body>
<header><div class="brand"><img src="assets/icons/icon-48.png" width="34" height="34" alt=""><div><strong>Running SOP</strong><span data-word="library"></span></div></div><div class="header-actions"><button id="refresh" type="button" data-word="refresh"></button><a href="options.html" data-word="settings"></a></div></header>
<p id="status" role="status" aria-live="polite"></p><p class="privacy-notice" data-word="sensitive"></p>
<main><aside><h2 data-word="categories"></h2><nav id="categories" aria-label="Categories"></nav><p class="source-note" id="source-name"></p></aside>
<section class="content"><div id="list-pane"><h1 id="category-title"></h1><form id="search-form"><label for="query" data-word="search"></label><div class="search"><input id="query" type="search" maxlength="120" autocomplete="off"><button type="submit" data-word="search"></button></div></form>
<div class="table-area"><table><thead><tr><th scope="col" data-word="name"></th><th scope="col" data-word="category"></th><th scope="col" data-word="read"></th></tr></thead><tbody id="sops"></tbody></table></div><p id="empty" hidden data-word="empty"></p><div class="pagination"><span id="count"></span><div><button id="previous" type="button" data-word="previous"></button><span id="page-number"></span><button id="next" type="button" data-word="next"></button></div></div></div>
<article id="reader" hidden><button id="back-list" type="button" class="quiet" data-word="back"></button><div class="reader-heading"><h1 id="sop-title"></h1><button id="history-open" type="button" data-word="history" aria-haspopup="dialog" aria-controls="history-dialog"></button></div><p id="version"></p><div id="historical-banner" hidden><strong data-word="historical"></strong><button id="return-current" type="button" data-word="current"></button></div><p id="reader-status" role="status" aria-live="polite"></p><div id="guide"></div></article></section></main>
<dialog id="history-dialog" aria-labelledby="history-title"><div class="dialog-heading"><h2 id="history-title" data-word="history"></h2><button id="history-close" type="button" data-word="close"></button></div><p class="muted" data-word="retention"></p><p id="history-status" role="status" aria-live="polite"></p><ul id="history-list"></ul><button id="history-more" type="button" hidden data-word="more"></button></dialog>
<dialog id="image-dialog" aria-labelledby="image-title"><div class="dialog-heading"><h2 id="image-title" data-word="image"></h2><button id="image-close" type="button" data-word="close"></button></div><div id="large-picture"></div></dialog>
<script src="sync-engine.js"></script><script src="sync-runtime.js"></script><script src="image-marks.js"></script><script src="catalog-engine.js"></script><script src="sop-assets.js"></script><script src="storage-source.js"></script><script src="catalog-runtime.js"></script><script src="category-engine.js"></script><script src="folder-history.js"></script><script src="locale-data.js"></script><script src="traditional-zh.js"></script><script src="workspace-i18n.js"></script><script src="ui-icons.js"></script><script src="screenshot-editor.js"></script><script src="team-client.js"></script><script src="team-settings.js"></script><script src="library.js"></script>
</body></html>
