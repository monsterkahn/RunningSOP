<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Running SOP</title><link rel="icon" href="assets/icons/icon-32.png"><link rel="stylesheet" href="library.css"></head>
<body>
<header><div class="brand"><img src="assets/icons/icon-48.png" width="34" height="34" alt=""><div><strong>Running SOP</strong><span data-word="library"></span></div></div><div class="header-actions"><button id="refresh" type="button" data-word="refresh"></button><a href="options.html" data-word="settings"></a></div></header>
<nav class="unified-nav" aria-label="SOP"><a href="dashboard.html?source=connected#overview" data-word="overview"></a><a href="dashboard.html?source=connected#sops" data-word="all"></a><a id="library-relationships" href="relationships.html" data-word="relations"></a></nav>
<p id="status" role="status" aria-live="polite"></p><div id="recovery" hidden><button id="choose-folder" type="button" data-word="chooseFolder"></button><details id="failure-details" hidden><summary data-word="failureDetails"></summary><p id="failure-reason"></p></details></div><p class="privacy-notice" data-word="sensitive"></p>
<main><aside><div class="categories-heading"><h2 data-word="categories"></h2><button id="category-settings" class="quiet" type="button" data-category-word="manage" disabled></button></div><nav id="categories" aria-label="Categories"></nav><p class="source-note" id="source-name"></p></aside>
<section class="content"><div id="list-pane"><div class="library-heading"><h1 id="category-title"></h1><span id="library-total" class="muted"></span></div><form id="search-form"><label for="query" data-word="search"></label><div class="search"><input id="query" type="search" maxlength="120" autocomplete="off"><button type="submit" data-word="search"></button></div></form>
<div class="table-area"><table><thead><tr><th scope="col" data-word="name"></th><th scope="col" data-word="category"></th><th scope="col" data-word="read"></th></tr></thead><tbody id="sops"></tbody></table></div><p id="empty" hidden data-word="empty"></p><div class="pagination"><span id="count"></span><div><button id="previous" type="button" data-word="previous"></button><span id="page-number"></span><button id="next" type="button" data-word="next"></button></div></div></div>
<article id="reader" hidden><button id="back-list" type="button" class="quiet" data-word="back"></button><div class="reader-heading"><h1 id="sop-title"></h1><button id="history-open" type="button" data-word="history" aria-haspopup="dialog" aria-controls="history-dialog"></button></div><p id="version"></p><div id="historical-banner" hidden><strong data-word="historical"></strong><button id="return-current" type="button" data-word="current"></button></div><p id="reader-status" role="status" aria-live="polite"></p><div id="guide"></div></article></section></main>
<dialog id="history-dialog" aria-labelledby="history-title"><div class="dialog-heading"><h2 id="history-title" data-word="history"></h2><button id="history-close" type="button" data-word="close"></button></div><p class="muted" data-word="retention"></p><p id="history-status" role="status" aria-live="polite"></p><ul id="history-list"></ul><button id="history-more" type="button" hidden data-word="more"></button></dialog>
<dialog id="image-dialog" aria-labelledby="image-title"><div class="dialog-heading"><h2 id="image-title" data-word="image"></h2><button id="image-close" type="button" data-word="close"></button></div><div id="large-picture"></div></dialog>
<dialog id="category-dialog" aria-labelledby="category-title-edit">
<div class="dialog-heading"><h2 id="category-title-edit" data-category-word="manage"></h2><button id="category-close" type="button" data-category-word="close"></button></div>
<p class="muted" data-category-word="notice"></p><p id="category-status" role="status" aria-live="polite"></p>
<form id="category-form" class="category-form"><label for="category-edit" data-category-word="choose"></label><select id="category-edit"></select><label for="category-name" data-category-word="name"></label><input id="category-name" required maxlength="40" autocomplete="off"><label for="category-parent" data-category-word="parent"></label><select id="category-parent"></select><div class="category-style-fields"><fieldset><legend data-category-word="color"></legend><div id="category-color" class="category-choices"></div></fieldset><fieldset><legend data-category-word="icon"></legend><div id="category-icon" class="category-choices"></div></fieldset><span id="category-preview" class="category-preview" aria-hidden="true"></span></div><div class="category-actions"><button type="submit" data-category-word="save"></button><button id="category-delete" type="button" data-category-word="remove" disabled></button></div></form></dialog>
<dialog id="assignment-dialog" aria-labelledby="assignment-title"><div class="dialog-heading"><h2 id="assignment-title" data-category-word="assign"></h2><button id="assignment-close" type="button" data-category-word="close"></button></div><p id="assignment-name"></p><p class="muted" data-category-word="notice"></p><p id="assignment-status" role="status" aria-live="polite"></p><form id="assignment-form" class="category-form"><label for="assignment-category" data-category-word="category"></label><select id="assignment-category"></select><div class="category-actions"><button type="submit" data-category-word="save"></button></div></form></dialog>
<script src="sync-engine.js"></script><script src="sync-runtime.js"></script><script src="image-marks.js"></script><script src="screenshot-redaction.js"></script><script src="catalog-engine.js"></script><script src="sop-assets.js"></script><script src="storage-source.js"></script><script src="catalog-runtime.js"></script><script src="category-engine.js"></script><script src="category-store.js"></script><script src="library-categories.js"></script><script src="folder-history.js"></script><script src="locale-data.js"></script><script src="traditional-zh.js"></script><script src="workspace-i18n.js"></script><script src="ui-icons.js"></script><script src="screenshot-editor.js"></script><script src="team-client.js"></script><script src="team-settings.js"></script><script src="library.js"></script>
</body></html>
