<!doctype html>
<html lang="zh-CN">
<head><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png?v=1.0.0"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>截图查看</title><link rel="stylesheet" href="screenshot-viewer.css"></head>
<body>
 <header class="toolbar">
  <div class="heading"><strong id="page-title">截图查看</strong><span id="image-meta"></span></div>
  <div class="zoom-tools"><button id="fit" type="button">适应窗口</button><button id="actual" type="button">原始尺寸</button><button id="zoom-out" type="button" aria-label="缩小">−</button><output id="zoom-value">100%</output><button id="zoom-in" type="button" aria-label="放大">＋</button></div>
  <div class="edit-tools" id="edit-tools" hidden>
   <button id="marks-move" type="button" aria-pressed="false">移动</button><button id="marks-number" type="button" aria-pressed="true">编号</button><button id="marks-arrow" type="button" aria-pressed="false">箭头</button><button id="marks-rect" type="button" aria-pressed="false">方框</button><button id="undo" type="button">撤销</button><button id="clear" type="button">清除</button><span id="marks-count"></span><button id="cancel" type="button" class="quiet">取消</button><button id="save" type="button" class="primary">保存标记</button>
  </div>
  <button id="close-viewer" type="button">关闭</button>
 </header>
 <main id="viewport" aria-label="截图画布"><div id="stage"><img id="picture" alt="截图"><div id="overlay" aria-hidden="true"></div></div></main>
 <p id="status" role="status"></p>
 <script src="image-marks.js"></script><script src="locale-data.js"></script><script src="workspace-i18n.js"></script><script src="screenshot-viewer.js"></script>
</body></html>
